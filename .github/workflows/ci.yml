name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bookforge
          POSTGRES_PASSWORD: bookforge_test_pw
          POSTGRES_DB: bookforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bookforge -d bookforge_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://bookforge:bookforge_test_pw@127.0.0.1:5432/bookforge_test?schema=public
      TEST_DATABASE_URL: postgresql://bookforge:bookforge_test_pw@127.0.0.1:5432/bookforge_test?schema=public
      SESSION_SECRET: ci-only-not-for-production-32chars!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm test
      - run: npm run build
